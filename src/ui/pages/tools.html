<section class="page" data-page="tools"><div class="page-top"><p class="eyebrow">PERSONNEL UTILITIES / DAILY OPERATIONS</p><h1>職員支援 <span class="thin">/ PERSONAL</span></h1><p class="intro">職員用タスク・集中タイマー・使用端末の状態を確認します。</p></div><section class="staff-panel"><h2>端末状況 <small>DEVICE STATUS</small></h2><dl class="staff-readouts"><div><dt>電池残量</dt><dd id="homeBattery">--%</dd><small id="batterySub">取得できません</small><i class="battery-track"><i id="batteryFill"></i></i></div><div><dt>端末時刻</dt><dd id="deviceTime">--</dd></div></dl></section><div class="section-head"><h2>PERSONAL TASKS <span>/ 自分の予定</span></h2><span class="tag-real">端末保存</span></div><div class="task-panel"><form id="taskForm" class="task-form"><input id="taskInput" autocomplete="off" maxlength="80" placeholder="タスクを入力して追加" aria-label="新しいタスク"><button type="submit">＋ 追加</button></form><div id="taskList" class="tasks"><div class="empty">タスクはまだありません。</div></div><div id="tasksSummary" class="task-footer">0 OPEN / 0 COMPLETED</div></div><div class="section-head"><h2>FOCUS TIMER <span>/ 集中タイマー</span></h2><span class="tag-real">操作中のみ</span></div><div class="timer-panel"><div class="timer-dial"><svg viewBox="0 0 160 160"><circle cx="80" cy="80" r="68" fill="none" stroke="#41301e" stroke-width="6"/><circle id="timerCircle" cx="80" cy="80" r="68" fill="none" stroke="#ffae4b" stroke-width="6" stroke-linecap="round" stroke-dasharray="427.256" stroke-dashoffset="0" transform="rotate(-90 80 80)"/></svg><div class="timer-time" id="timerTime">25:00</div></div><div class="timer-presets"><button data-min="5">05 MIN</button><button data-min="15">15 MIN</button><button data-min="25" class="active">25 MIN</button></div><div class="timer-actions"><button id="timerStart" class="primary-btn">▶ 開始</button><button id="timerReset" class="secondary-btn">↻ リセット</button></div><p class="fineprint">アプリを閉じると通知は届きません。端末内で稼働するタイマーです。</p></div></section>
