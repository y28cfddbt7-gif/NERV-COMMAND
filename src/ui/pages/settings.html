<section class="page" data-page="settings"><div class="page-top"><p class="eyebrow">CONTROL PANEL / PREFERENCES</p><h1>端末設定 <span class="thin">/ SYSTEM</span></h1><p class="intro">表示と音、保存情報の取り扱い。</p></div><div class="settings-list"><button id="soundSwitch" class="setting-row"><span><b>効果音</b><small>確認・承認・警告の電子音</small></span><strong id="soundFlag">OFF</strong></button><div class="setting-audio"><label for="soundVolume">効果音の音量 <output id="soundVolumeValue" for="soundVolume">55%</output></label><input id="soundVolume" type="range" min="0" max="100" step="5" value="55"><button id="soundPreview" type="button">▷ 音を確認</button><small>音は効果音ON時のみ再生。警報音も同じ設定に従います。</small></div><button id="autoWeatherSwitch" class="setting-row"><span><b>天気の自動更新</b><small>次回起動時、位置情報を取得して更新</small></span><strong id="autoWeatherFlag">OFF</strong></button><button id="motionSwitch" class="setting-row"><span><b>画面アニメーション</b><small>レーダー・回路・通信アニメーション</small></span><strong id="motionFlag">ON</strong></button><button id="bootSwitch" class="setting-row"><span><b>起動画面</b><small>アプリ開始時に認証画面を表示</small></span><strong id="bootFlag">ON</strong></button><button id="clearTasks" class="setting-row danger-row"><span><b>完了タスクを削除</b><small>完了済みのタスクだけを消去</small></span><strong>削除 ›</strong></button><button id="resetSim" class="setting-row danger-row"><span><b>管制シミュレーション初期化</b><small>EVA・都市・MAGI・作戦の設定を初期化</small></span><strong>初期化 ›</strong></button></div><div class="privacy"><strong>REAL DATA / 作品世界 SIM の区別</strong><p>時刻・位置情報から取得した天候・端末電池・あなたのタスクは実データです。第3新東京市の施設、EVA、MAGI審議、作戦内容は架空のシミュレーションです。</p><p>タスクと設定、模擬運用の進行状況はScriptableのローカルファイルへ保存。位置情報は天気の取得時のみ利用し、取得した座標を外部の気象サービスに送信します。位置履歴の保存は行いません。</p></div></section>
